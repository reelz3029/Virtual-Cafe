<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>☕ Somewhere — 고양이 카페</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async></script>
  <link rel="stylesheet" href="/src/styles/loading.css" />
</head>
<body>
  <canvas id="world-canvas"></canvas>
  <div id="overlay"></div>
  <div id="ui-root"></div>

  <div id="loading-screen">
    <!-- 고양이 일러스트 — 치비 라인아트 스타일 -->
    <div class="loading-cat-wrap">
      <svg width="120" height="132" viewBox="0 0 120 132" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 그림자 -->
        <ellipse cx="55" cy="125" rx="23" ry="5" fill="rgba(120,80,30,0.13)"/>
        <!-- 꼬리 (흔들림 애니메이션) -->
        <g class="cat-tail">
          <path d="M70 102 Q96 86 86 64" stroke="#D4C4A8" stroke-width="11" stroke-linecap="round" fill="none"/>
          <path d="M70 102 Q96 86 86 64" stroke="#F5EDD8" stroke-width="6.5" stroke-linecap="round" fill="none"/>
        </g>
        <!-- 왼쪽 귀 -->
        <ellipse cx="27" cy="26" rx="14" ry="18" fill="#D4C4A8" transform="rotate(-14 27 26)"/>
        <ellipse cx="27" cy="26" rx="11" ry="14.5" fill="#F5EDD8" transform="rotate(-14 27 26)"/>
        <ellipse cx="27" cy="28" rx="6" ry="8.5" fill="#FFD4CC" transform="rotate(-14 27 26)"/>
        <!-- 오른쪽 귀 -->
        <ellipse cx="83" cy="26" rx="14" ry="18" fill="#D4C4A8" transform="rotate(14 83 26)"/>
        <ellipse cx="83" cy="26" rx="11" ry="14.5" fill="#F5EDD8" transform="rotate(14 83 26)"/>
        <ellipse cx="83" cy="28" rx="6" ry="8.5" fill="#FFD4CC" transform="rotate(14 83 26)"/>
        <!-- 머리 -->
        <circle cx="55" cy="57" r="33" fill="#D4C4A8"/>
        <circle cx="55" cy="56" r="31" fill="#F5EDD8"/>
        <!-- 몸통 -->
        <ellipse cx="55" cy="101" rx="27" ry="25" fill="#D4C4A8"/>
        <ellipse cx="55" cy="100" rx="25" ry="23" fill="#F5EDD8"/>
        <!-- 앞발 -->
        <ellipse cx="35" cy="116" rx="13" ry="8.5" fill="#D4C4A8"/>
        <ellipse cx="35" cy="115" rx="11" ry="7" fill="#F5EDD8"/>
        <ellipse cx="75" cy="116" rx="13" ry="8.5" fill="#D4C4A8"/>
        <ellipse cx="75" cy="115" rx="11" ry="7" fill="#F5EDD8"/>
        <!-- 눈 (큰 동그란 치비 눈) -->
        <circle cx="43" cy="55" r="9" fill="#1A1010"/>
        <circle cx="45" cy="51" r="3" fill="white"/>
        <circle cx="67" cy="55" r="9" fill="#1A1010"/>
        <circle cx="69" cy="51" r="3" fill="white"/>
        <!-- 코 -->
        <path d="M51 67 L55 72 L59 67 Z" fill="#E08090"/>
        <!-- 입 -->
        <path d="M50 72 Q55 78 60 72" stroke="rgba(90,50,20,0.65)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <!-- 볼터치 -->
        <ellipse cx="32" cy="66" rx="10" ry="5.5" fill="rgba(240,140,125,0.26)"/>
        <ellipse cx="78" cy="66" rx="10" ry="5.5" fill="rgba(240,140,125,0.26)"/>
        <!-- 수염 -->
        <line x1="3"  y1="64" x2="36" y2="67" stroke="rgba(100,70,40,0.42)" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="3"  y1="71" x2="36" y2="71" stroke="rgba(100,70,40,0.42)" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="107" y1="64" x2="74" y2="67" stroke="rgba(100,70,40,0.42)" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="107" y1="71" x2="74" y2="71" stroke="rgba(100,70,40,0.42)" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="loading-logo">☕ Somewhere</div>
    <div class="loading-subtitle">따뜻한 공간을 준비하고 있어요</div>
    <div class="loading-paws">
      <div class="loading-paw"></div>
      <div class="loading-paw"></div>
      <div class="loading-paw"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
